<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f8f9fa; }
        .card { margin-top: 50px; border-radius: 12px; }
        h1 { color: #0d6efd; }
        .btn-primary { background-color: #0d6efd; border: none; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card p-4 shadow" style="width: 500px;">
            <h1 class="text-center mb-4">Upload Your Resume</h1>
            <form action="/upload" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <input type="file" name="resume" class="form-control" accept=".docx" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Analyze Resume</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
